<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="__SCRAPBOOK_DESCRIPTION__"
    />
    <meta name="theme-color" content="#3f3028" />
    <!--
      The SVG draws the emoji as text, so it picks up each device's own emoji
      font — Apple Color Emoji on iPhone and Mac. The PNG covers browsers that
      ignore SVG favicons, and apple-touch-icon is what iOS uses on the home
      screen, which is why that one is opaque.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>__SCRAPBOOK_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
